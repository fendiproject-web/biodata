<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fendi Store - Link Bio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <!-- Profile Section -->
    <div class="profile-section">
      <div class="avatar-wrapper">
        <picture>
          <source srcset="profile.webp" type="image/webp">
          <img src="profile.png" alt="Fendi Store Profile" class="avatar-img" onerror="this.onerror=null; this.src='profile.png';">
        </picture>
      </div>
      <h1 class="profile-title">FENDI STORE</h1>
      <p class="profile-subtitle">Official Contact & Social Media</p>
    </div>

    <!-- Links Container -->
    <div class="links-container">
      
      <!-- Instagram -->
      <a href="https://instagram.com/fendi.store_" target="_blank" rel="noopener noreferrer" class="neu-btn btn-instagram">
        <div class="btn-content">
          <svg class="icon" viewBox="0 0 24 24">
            <defs>
              <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#f09433"/>
                <stop offset="25%" stop-color="#e6683c"/>
                <stop offset="50%" stop-color="#dc2743"/>
                <stop offset="75%" stop-color="#cc2366"/>
                <stop offset="100%" stop-color="#bc1888"/>
              </linearGradient>
            </defs>
            <path fill="url(#ig-grad)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
          <span class="btn-text">Instagram</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>

      <!-- TikTok -->
      <a href="https://tiktok.com/@fenditiktok__" target="_blank" rel="noopener noreferrer" class="neu-btn btn-tiktok">
        <div class="btn-content">
          <svg class="icon" viewBox="0 0 24 24">
            <defs>
              <linearGradient id="tt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#25F4EE"/>
                <stop offset="100%" stop-color="#FE2C55"/>
              </linearGradient>
            </defs>
            <path fill="url(#tt-grad)" d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 1 1-5.2-1.74 2.89 2.89 0 0 1 2.31-1.23h.03V9.21a6.32 6.32 0 1 0 6.32 6.32V8.92a8.3 8.3 0 0 0 5.08 1.72V7.19a4.84 4.84 0 0 1-1.32-.5z"/>
          </svg>
          <span class="btn-text">TikTok</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>

      <!-- Telegram -->
      <a href="https://t.me/testifendistore" target="_blank" rel="noopener noreferrer" class="neu-btn btn-telegram">
        <div class="btn-content">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.02 9.51c-.15.68-.55.85-1.12.53l-3.08-2.27-1.48 1.43c-.16.16-.3.3-.62.3l.22-3.13 5.7-5.15c.25-.22-.05-.34-.38-.12l-7.04 4.43-3.04-.95c-.66-.21-.67-.66.14-.98l11.88-4.58c.55-.2 1.03.13.85.98z"/>
          </svg>
          <span class="btn-text">Telegram</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>

      <!-- Dropdown WhatsApp -->
      <div class="accordion">
        <button class="neu-btn btn-whatsapp" onclick="toggleAccordion('wa-dropdown')">
          <div class="btn-content">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12.011 0C5.384 0 0 5.383 0 12.011c0 2.116.553 4.187 1.603 6.012L0 24l6.128-1.608a11.97 11.97 0 0 0 5.883 1.528h.005c6.626 0 12.01-5.384 12.01-12.01C24.026 5.383 18.638 0 12.011 0zm0 22.015h-.004a9.98 9.98 0 0 1-5.088-1.396l-.366-.217-3.782.992 1.009-3.687-.238-.379a9.96 9.96 0 0 1-1.531-5.317c0-5.513 4.485-9.998 10.004-9.998 5.518 0 10.003 4.485 10.003 9.998 0 5.514-4.485 10.003-10.003 10.003zm5.485-7.498c-.301-.151-1.782-.88-2.058-.98-.277-.101-.478-.151-.68.151-.201.302-.78 1.006-.956 1.207-.176.201-.352.226-.653.075-.302-.151-1.274-.47-2.427-1.498-.897-.799-1.502-1.788-1.678-2.089-.176-.302-.019-.465.132-.615.136-.135.302-.352.453-.528.151-.176.201-.302.302-.503.101-.201.05-.377-.025-.528-.075-.151-.68-1.636-.931-2.239-.245-.588-.495-.508-.68-.517-.176-.008-.377-.008-.578-.008-.201 0-.528.075-.804.377-.276.302-1.056 1.031-1.056 2.515 0 1.484 1.081 2.917 1.232 3.118.151.201 2.127 3.248 5.153 4.555.72.311 1.282.497 1.721.637.723.23 1.38.197 1.9.12.58-.086 1.782-.729 2.033-1.433.251-.704.251-1.307.176-1.433-.075-.126-.276-.201-.577-.352z"/>
            </svg>
            <span class="btn-text">WhatsApp Official</span>
          </div>
          <svg class="arrow-icon toggle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="wa-dropdown" class="accordion-content">
          <!-- WhatsApp Japost -->
          <a href="https://wa.me/6285854325988" target="_blank" rel="noopener noreferrer" class="sub-btn btn-whatsapp">
            <svg class="sub-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12.011 0C5.384 0 0 5.383 0 12.011c0 2.116.553 4.187 1.603 6.012L0 24l6.128-1.608a11.97 11.97 0 0 0 5.883 1.528h.005c6.626 0 12.01-5.384 12.01-12.01C24.026 5.383 18.638 0 12.011 0zm0 22.015h-.004a9.98 9.98 0 0 1-5.088-1.396l-.366-.217-3.782.992 1.009-3.687-.238-.379a9.96 9.96 0 0 1-1.531-5.317c0-5.513 4.485-9.998 10.004-9.998 5.518 0 10.003 4.485 10.003 9.998 0 5.514-4.485 10.003-10.003 10.003zm5.485-7.498c-.301-.151-1.782-.88-2.058-.98-.277-.101-.478-.151-.68.151-.201.302-.78 1.006-.956 1.207-.176.201-.352.226-.653.075-.302-.151-1.274-.47-2.427-1.498-.897-.799-1.502-1.788-1.678-2.089-.176-.302-.019-.465.132-.615.136-.135.302-.352.453-.528.151-.176.201-.302.302-.503.101-.201.05-.377-.025-.528-.075-.151-.68-1.636-.931-2.239-.245-.588-.495-.508-.68-.517-.176-.008-.377-.008-.578-.008-.201 0-.528.075-.804.377-.276.302-1.056 1.031-1.056 2.515 0 1.484 1.081 2.917 1.232 3.118.151.201 2.127 3.248 5.153 4.555.72.311 1.282.497 1.721.637.723.23 1.38.197 1.9.12.58-.086 1.782-.729 2.033-1.433.251-.704.251-1.307.176-1.433-.075-.126-.276-.201-.577-.352z"/>
            </svg>
            <span class="btn-text">WhatsApp Japost (0858-5432-5988)</span>
          </a>
          <!-- WhatsApp Rekber -->
          <a href="https://wa.me/6281553801021" target="_blank" rel="noopener noreferrer" class="sub-btn btn-whatsapp">
            <svg class="sub-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12.011 0C5.384 0 0 5.383 0 12.011c0 2.116.553 4.187 1.603 6.012L0 24l6.128-1.608a11.97 11.97 0 0 0 5.883 1.528h.005c6.626 0 12.01-5.384 12.01-12.01C24.026 5.383 18.638 0 12.011 0zm0 22.015h-.004a9.98 9.98 0 0 1-5.088-1.396l-.366-.217-3.782.992 1.009-3.687-.238-.379a9.96 9.96 0 0 1-1.531-5.317c0-5.513 4.485-9.998 10.004-9.998 5.518 0 10.003 4.485 10.003 9.998 0 5.514-4.485 10.003-10.003 10.003zm5.485-7.498c-.301-.151-1.782-.88-2.058-.98-.277-.101-.478-.151-.68.151-.201.302-.78 1.006-.956 1.207-.176.201-.352.226-.653.075-.302-.151-1.274-.47-2.427-1.498-.897-.799-1.502-1.788-1.678-2.089-.176-.302-.019-.465.132-.615.136-.135.302-.352.453-.528.151-.176.201-.302.302-.503.101-.201.05-.377-.025-.528-.075-.151-.68-1.636-.931-2.239-.245-.588-.495-.508-.68-.517-.176-.008-.377-.008-.578-.008-.201 0-.528.075-.804.377-.276.302-1.056 1.031-1.056 2.515 0 1.484 1.081 2.917 1.232 3.118.151.201 2.127 3.248 5.153 4.555.72.311 1.282.497 1.721.637.723.23 1.38.197 1.9.12.58-.086 1.782-.729 2.033-1.433.251-.704.251-1.307.176-1.433-.075-.126-.276-.201-.577-.352z"/>
            </svg>
            <span class="btn-text">WhatsApp Rekber (0815-5380-1021)</span>
          </a>
        </div>
      </div>

      <!-- Dropdown QRIS Donasi -->
      <div class="accordion">
        <button class="neu-btn btn-qris" onclick="toggleAccordion('qris-dropdown')">
          <div class="btn-content">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm13-2h3v2h-3zm-3 0h2v3h-2zm3 3h3v5h-3zm-3 2h2v3h-2zm-2-2h2v2h-2zm0 3h2v2h-2zm5 0h3v2h-3z"/>
            </svg>
            <span class="btn-text">Donasi / QRIS</span>
          </div>
          <svg class="arrow-icon toggle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="qris-dropdown" class="accordion-content">
          <div class="qris-card">
            <!-- Container Gambar Otomatis Menyesuaikan Rasio Asli -->
            <div class="qris-img-wrapper">
              <picture>
                <source srcset="qris.webp" type="image/webp">
                <img id="qris-image-src" src="qris.png" alt="QRIS Donasi" class="qris-img" onerror="this.onerror=null; this.src='qris.png';">
              </picture>
            </div>
            <p class="qris-caption">Scan QRIS untuk pembayaran / donasi</p>
            
            <!-- Tombol Lihat Jelas (Modal Popup Dalam Halaman) -->
            <button class="view-qris-btn btn-qris" onclick="openModal()">
              <svg class="view-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>Lihat Gambar Jelas</span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal Popup QRIS (Tanpa Buka Web Lain) -->
  <div id="qris-modal" class="modal" onclick="closeModal()">
    <div class="modal-wrapper" onclick="event.stopPropagation()">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <img id="modal-img" src="qris.png" alt="QRIS Full View" class="modal-img">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
