<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fendi Store - Link Bio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <!-- Profile Section -->
    <div class="profile-section">
      <div class="avatar-wrapper">
        <picture>
          <source srcset="profile.webp" type="image/webp">
          <img src="profile.png" alt="Fendi Store Profile" class="avatar-img" onerror="this.onerror=null; this.src='profile.png';">
        </picture>
      </div>
      <h1 class="profile-title">FENDI STORE</h1>
      <p class="profile-subtitle">Official Contact & Social Media</p>
    </div>

    <!-- Links Container -->
    <div class="links-container">
      
      <!-- Instagram -->
      <a href="https://instagram.com/fendi.store_" target="_blank" rel="noopener noreferrer" class="neu-btn">
        <div class="btn-content">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
          <span>Instagram</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>

      <!-- TikTok -->
      <a href="https://tiktok.com/@fenditiktok__" target="_blank" rel="noopener noreferrer" class="neu-btn">
        <div class="btn-content">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 1 1-5.2-1.74 2.89 2.89 0 0 1 2.31-1.23h.03V9.21a6.32 6.32 0 1 0 6.32 6.32V8.92a8.3 8.3 0 0 0 5.08 1.72V7.19a4.84 4.84 0 0 1-1.32-.5z"/>
          </svg>
          <span>TikTok</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>

      <!-- Telegram -->
      <a href="https://t.me/testifendistore" target="_blank" rel="noopener noreferrer" class="neu-btn">
        <div class="btn-content">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.02 9.51c-.15.68-.55.85-1.12.53l-3.08-2.27-1.48 1.43c-.16.16-.3.3-.62.3l.22-3.13 5.7-5.15c.25-.22-.05-.34-.38-.12l-7.04 4.43-3.04-.95c-.66-.21-.67-.66.14-.98l11.88-4.58c.55-.2 1.03.13.85.98z"/>
          </svg>
          <span>Telegram</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>

      <!-- Dropdown WhatsApp -->
      <div class="accordion">
        <button class="neu-btn accordion-btn" onclick="toggleAccordion('wa-dropdown')">
          <div class="btn-content">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.705 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
            </svg>
            <span>WhatsApp Official</span>
          </div>
          <svg class="arrow-icon toggle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="wa-dropdown" class="accordion-content">
          <a href="https://wa.me/6285854325988" target="_blank" rel="noopener noreferrer" class="sub-btn">
            <svg class="sub-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            <span>WhatsApp Japost (0858-5432-5988)</span>
          </a>
          <a href="https://wa.me/6281553801021" target="_blank" rel="noopener noreferrer" class="sub-btn">
            <svg class="sub-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
            <span>WhatsApp Rekber (0815-5380-1021)</span>
          </a>
        </div>
      </div>

      <!-- Dropdown QRIS Donasi -->
      <div class="accordion">
        <button class="neu-btn accordion-btn" onclick="toggleAccordion('qris-dropdown')">
          <div class="btn-content">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm13-2h3v2h-3zm-3 0h2v3h-2zm3 3h3v5h-3zm-3 2h2v3h-2zm-2-2h2v2h-2zm0 3h2v2h-2zm5 0h3v2h-3z"/>
            </svg>
            <span>Donasi / QRIS</span>
          </div>
          <svg class="arrow-icon toggle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="qris-dropdown" class="accordion-content">
          <div class="qris-card">
            <picture>
              <source srcset="qris.webp" type="image/webp">
              <img src="qris.png" alt="QRIS Donasi" class="qris-img" onerror="this.onerror=null; this.src='qris.png';">
            </picture>
            <p class="qris-caption">Scan QRIS untuk pembayaran / donasi</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
